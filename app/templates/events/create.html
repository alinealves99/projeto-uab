{% extends "layout.html" %}

{% block title %}Criar Evento - Projeto UAB{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Cadastrar Novo Evento</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('eventos.criar_evento') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título do Evento</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="data_inicio" class="form-label">Data e Hora de Início</label>
                            <input type="datetime-local" class="form-control" id="data_inicio" name="data_inicio" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="data_fim" class="form-label">Data e Hora de Fim</label>
                            <input type="datetime-local" class="form-control" id="data_fim" name="data_fim" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="local" class="form-label">Local</label>
                        <input type="text" class="form-control" id="local" name="local" required>
                    </div>
                    <div class="mb-3">
                        <label for="oficio" class="form-label">Anexar Ofício (PDF/JPG/PNG)</label>
                        <input type="file" class="form-control" id="oficio" name="oficio" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('eventos.listar_eventos') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Cadastrar Evento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
