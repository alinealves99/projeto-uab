{% extends 'layout.html' %}

{% block title %}Criar Usuário - Projeto UAB{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Novo Usuário</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('usuarios.criar_usuario') }}" method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required placeholder="Ex: João Silva">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="email@exemplo.com">
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Perfil de Acesso</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" selected disabled>Selecione um perfil...</option>
                            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                            <option value="SECRETARIO">SECRETARIO</option>
                            <option value="CONSULTOR">CONSULTOR</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('usuarios.listar_usuarios') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Usuário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
